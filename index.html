<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Server Data</title> <style> * { box-sizing: border-box; } body { margin: 0; padding: 40px; background: #0d0d0d; color: #ffffff; font-family: Arial, sans-serif; } h1 { text-align: center; margin-bottom: 30px; } .container { max-width: 900px; margin: auto; } .server { background: #181818; border: 1px solid #303030; border-radius: 12px; padding: 20px; margin-bottom: 15px; } .server h2 { margin-top: 0; } .online { color: #4cff88; font-weight: bold; } .offline { color: #ff4c4c; font-weight: bold; } pre { background: #080808; padding: 15px; border-radius: 8px; overflow-x: auto; color: #b8b8b8; } </style> </head> <body> <div class="container"> <h1>Server Data</h1> <div id="servers"> Loading... </div> </div> <script> const jsonURL = "serverdata.json"; async function loadServers() { try { const response = await fetch(jsonURL); if (!response.ok) { throw new Error("Could not load serverdata.json"); } const data = await response.json(); const container = document.getElementById("servers"); container.innerHTML = ""; /* If your JSON contains an array of servers, this will display each server. */ if (Array.isArray(data)) { data.forEach(server => { const div = document.createElement("div"); div.className = "server"; div.innerHTML = ` <h2>${server.name || "Unknown Server"}</h2> <p> Status: <span class="${server.online ? "online" : "offline"}"> ${server.online ? "ONLINE" : "OFFLINE"} </span> </p> <p> Players: ${server.players ?? 0} </p> <p> IP: ${server.ip || "Unknown"} </p> `; container.appendChild(div); }); } else { // If it's not an array, just display the JSON container.innerHTML = ` <div class="server"> <pre>${JSON.stringify(data, null, 4)}</pre> </div> `; } } catch (error) { document.getElementById("servers").innerHTML = ` <div class="server"> <p class="offline"> Error loading server data </p> <p>${error.message}</p> </div> `; } } loadServers(); </script> </body> </html>
